services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 15

  django:
    build:
      context: ./backend
      dockerfile: ../.docker/backend/Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      GRIP_URL: http://pushpin:5561
    command: sh -c "python manage.py migrate && gunicorn config.wsgi -b 0.0.0.0:8000 --workers 2"
    depends_on:
      postgres:
        condition: service_healthy

  pushpin:
    build: ./.docker/pushpin
    depends_on:
      - django
    # ports:
    #   - "7999:7999"  # uncomment to curl pushpin directly from the host

  front:
    build:
      context: ./front
      dockerfile: ../.docker/front/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - pushpin

volumes:
  pgdata:
