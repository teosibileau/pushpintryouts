services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 15

  django:
    build:
      context: ./backend
      dockerfile: ../.docker/backend/Dockerfile
    environment: &django-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      GRIP_URL: http://pushpin:5561
      SERVED_BY: django5-py312
    # the modern service is the only migration runner; stale connection rows
    # after a cold start are cleaned manually with `ahoy manage wipe_connections`
    # (a boot-time wipe would clear the other backend's live connections on
    # every restart or deploy)
    command: sh -c "python manage.py migrate && gunicorn config.wsgi -b 0.0.0.0:8000 --workers 2"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:
        aliases:
          - django-pool

  django-legacy:
    build:
      context: ./backend
      dockerfile: ../.docker/backend-legacy/Dockerfile
    environment:
      <<: *django-env
      SERVED_BY: django32-py38
    command: gunicorn config.wsgi -b 0.0.0.0:8000 --workers 2
    depends_on:
      postgres:
        condition: service_healthy
      django:
        condition: service_started
    networks:
      default:
        aliases:
          - django-pool

  pushpin:
    build: ./.docker/pushpin
    depends_on:
      - django
      - django-legacy
    # ports:
    #   - "7999:7999"  # uncomment to curl pushpin directly from the host

  front:
    build:
      context: ./front
      dockerfile: ../.docker/front/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - pushpin

volumes:
  pgdata:
