[project]
name = "pushpin-chat-backend"
version = "0.1.0"
description = "Pushpin chat PoC backend"
requires-python = ">=3.12,<4.0"
dependencies = [
    "Django (>=5.0,<6.0)",
    "djangorestframework (>=3.15)",
    "django-grip (>=3.4)",
    "gunicorn (>=22.0)",
    "psycopg[binary] (>=3.1)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-django = ">=4.8"
ruff = "0.16.4"
django-types = "^0.24.0"
djangorestframework-types = "^0.9.0"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[[tool.pyright.executionEnvironments]]
# tests duck-type requests and sockets on purpose
root = "tests"
extraPaths = ["."]
reportAttributeAccessIssue = "none"
reportArgumentType = "none"
reportOptionalMemberAccess = "none"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py38"
src = ["."]
extend-exclude = ["chat/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
