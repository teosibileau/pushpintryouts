# kamal-proxy routes by Host only, so the path split between static files
# and the Pushpin gateway happens here. ppchat-pushpin is the network alias
# of the pushpin app on the kamal docker network.

# Resolve the alias at request time through docker's embedded DNS; a static
# proxy_pass hostname is resolved once at nginx boot and goes stale when the
# pushpin container is replaced.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    set $pushpin http://ppchat-pushpin:7999;

    # kamal-proxy healthcheck target: must 200 before traffic cutover
    location = /up {
        return 200;
    }

    location /api/ {
        proxy_pass $pushpin;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass $pushpin;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # websockets are long-lived; the GRIP keep-alive pings every 45s
        # keep the socket inside this window
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
