name: CI

on:
  push:
    branches: [main, poc]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: |
          pipx install pre-commit
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pre-commit run --all-files --show-diff-on-failure

  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - runtime: modern
            python-version: "3.12"
          - runtime: legacy
            python-version: "3.8"
    name: backend-tests (${{ matrix.runtime }})
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chat
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat -d chat"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DJANGO_SECRET_KEY: ci-only
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - if: matrix.runtime == 'modern'
        run: |
          pipx install poetry
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - if: matrix.runtime == 'modern'
        run: poetry install --no-root
        working-directory: backend
      - if: matrix.runtime == 'modern'
        run: poetry run pytest
        working-directory: backend
      - if: matrix.runtime == 'legacy'
        run: pip install -r requirements-legacy.txt -r requirements-legacy-dev.txt
        working-directory: backend
      - if: matrix.runtime == 'legacy'
        run: pytest
        working-directory: backend

  front-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
        working-directory: front
      - run: npm run build
        working-directory: front
